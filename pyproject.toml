[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-assets"
version = "0.4.1"
requires-python = ">=3.10"
description = "Versioned corpus acquisition and normalization for data cleaning"
dependencies = []

[project.optional-dependencies]
fast = ["pyahocorasick>=2.1,<3"]

[project.scripts]
corpus = "corpus_assets.cli:main"

[tool.setuptools.package-data]
corpus_assets = ["sources.json", "taxonomy.json"]

[tool.setuptools.packages.find]
include = ["corpus_assets*"]
